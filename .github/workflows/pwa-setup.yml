name: Finish Image Converter PWA

on:
  push:
    paths:
      - '.github/workflows/pwa-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PWA metadata and registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          marker='<meta name="theme-color" content="#111827">'
          add='''<meta name="theme-color" content="#111827">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">\n<meta name="apple-mobile-web-app-title" content="Image Converter">\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">\n<link rel="apple-touch-icon" href="apple-touch-icon.png">'''
          if 'rel="manifest"' not in text:
              text=text.replace(marker,add,1)
          reg='''\n<script>\nif('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}\n</script>\n'''
          if "serviceWorker.register('./sw.js')" not in text:
              text=text.replace('</body>',reg+'</body>',1)
          p.write_text(text)
          PY
      - name: Commit PWA setup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Enable Image Converter PWA'
            git pull --rebase origin main
            git push
          fi
